   <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Sets the saved theme level before paint, so there's no flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ps-theme-level')
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.setAttribute('data-level', saved || (dark ? '4' : '1'))
        } catch (e) {}
      })()
    </script>
